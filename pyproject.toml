[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trappist-auto-bot"
version = "0.1.0"
description = "Piranewz AI Journalist - autonomous bilingual Telegram crypto news bot"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.11",
    "pycspr>=0.12.4",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "deep-translator>=1.11.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trappist_auto_bot*"]
